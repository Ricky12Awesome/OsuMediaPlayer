name: Publish release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    name: Test with generated media
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb xauth
          npx playwright install --with-deps chromium

      - name: Run unit and media tests
        run: npm test

      - name: Run offscreen Electron tests
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e

      - name: Run worker tests
        run: npm run test:streaming

      - name: Run visualizer tests
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:visualizer

  prepare:
    name: Prepare release tag
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag when the version changes
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          current_version="$(node -p 'require("./package.json").version')"
          release_tag="v${current_version}"

          if [[ "$REF" == refs/tags/* ]]; then
            if [[ "$REF_NAME" != "$release_tag" ]]; then
              echo "::error::Tag $REF_NAME does not match package.json version $current_version."
              exit 1
            fi
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version=""
          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null && \
            git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
            previous_version="$(
              git show "$BEFORE_SHA:package.json" |
                node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => process.stdout.write(JSON.parse(input).version ?? ""));'
            )"
          fi

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "package.json version is unchanged ($current_version)."
            exit 0
          fi

          if git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            if [[ "$tag_commit" != "$CURRENT_SHA" ]]; then
              echo "::error::Tag $release_tag already exists on $tag_commit, not $CURRENT_SHA."
              exit 1
            fi
            echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$release_tag" "$CURRENT_SHA" --message "Release $release_tag"
          git push origin "$release_tag"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} release
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            artifact_glob: release/*.AppImage
          - platform: Windows
            os: windows-latest
            artifact_glob: release/*.exe
          - platform: macOS
            os: macos-latest
            artifact_glob: release/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean package output
        shell: bash
        run: rm -rf release

      - name: Build distributable
        run: npm run package -- --publish never

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributables
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
